name: Android Release Build (signed)

# Manually triggered — produces a signed .aab (for Play Console upload) and
# a signed .apk (for direct sideload testing). Needs four repo secrets set
# first (Settings -> Secrets and variables -> Actions): ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD — see
# mobile-app/README.md for how to generate the keystore and these values.
# Without those secrets this workflow fails fast rather than silently
# producing an unsigned build (Play Console rejects unsigned uploads anyway).
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # packages must be set explicitly: the action's default list includes
      # the legacy "tools" package, which Google has removed from the SDK
      # repository, so the default makes sdkmanager fail with "Failed to
      # find package 'tools'". These three are what AGP 8.13 / compileSdk 36
      # actually needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install web dependencies
        run: npm ci

      - name: Sync web assets and Capacitor Android project
        run: npm run sync-web && npx cap sync android

      - name: Decode signing keystore
        working-directory: mobile-app/android/app
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 repo secret is not set — see mobile-app/README.md" >&2
            exit 1
          fi
          # Strip whitespace before decoding: a value pasted into the
          # secrets UI often picks up newlines, and base64 -d rejects the
          # whole thing rather than ignoring them.
          printf '%s' "$KS_B64" | tr -d '\r\n\t ' | base64 -d > release.keystore 2>/dev/null || true
          if [ ! -s release.keystore ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to anything. Regenerate it with:  base64 -i scotswim-release.keystore | tr -d '\n' | pbcopy  then paste it as the secret." >&2
            exit 1
          fi
          SIZE=$(wc -c < release.keystore | tr -d ' ')
          MAGIC=$(head -c 4 release.keystore | od -An -tx1 | tr -d ' \n')
          echo "decoded $SIZE bytes, leading bytes: $MAGIC"
          # A keystore starts with a known signature: JKS is feedfeed,
          # PKCS12 (keytool's default since Java 9) is a DER sequence, 3082.
          case "$MAGIC" in
            feedfeed*|3082*) ;;
            *)
              echo "::error::The decoded file is not a keystore — it begins $MAGIC, but a keystore begins feedfeed (JKS) or 3082 (PKCS12), and it is only $SIZE bytes (a real one is a few KB). The ANDROID_KEYSTORE_BASE64 secret is most likely truncated: it must be the WHOLE base64 string on one line. Regenerate with:  base64 -i scotswim-release.keystore | tr -d '\n' | pbcopy" >&2
              exit 1 ;;
          esac
          # Prove the password opens it, rather than finding out several
          # minutes later inside Gradle.
          if ! keytool -list -keystore release.keystore -storepass "$KS_PASS" >/tmp/ks.txt 2>&1; then
            echo "::error::The file is a keystore, but ANDROID_KEYSTORE_PASSWORD does not open it." >&2
            sed -e 's/^/    /' /tmp/ks.txt >&2
            exit 1
          fi
          if ! grep -qi "$KS_ALIAS" /tmp/ks.txt; then
            echo "::error::Keystore opened, but it contains no alias named '$KS_ALIAS'. Aliases present:" >&2
            grep -i "alias name" /tmp/ks.txt | sed -e 's/^/    /' >&2
            exit 1
          fi
          echo "Keystore decoded, opened, and contains alias '$KS_ALIAS'."


      - name: Build signed release AAB + APK
        working-directory: mobile-app/android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Remove decoded keystore before upload
        if: always()
        run: rm -f mobile-app/android/app/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: scotswim-android-release
          path: |
            mobile-app/android/app/build/outputs/bundle/release/*.aab
            mobile-app/android/app/build/outputs/apk/release/*.apk
