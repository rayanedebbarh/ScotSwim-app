<title>ScotSwim Results Upload</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --bg: #FFFDF9;
    --card: #fff;
    --fg: #2A1218;
    --fg2: rgba(42,18,24,.55);
    --fg3: rgba(42,18,24,.35);
    --border: rgba(42,18,24,.09);
    --accent: #6B1F33;
    --accent-fg: #F5E9DC;
    --green: #1B7A78;
    --red: #c0392b;
    --radius: 10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a0f13;
      --card: #251419;
      --fg: #F5E9DC;
      --fg2: rgba(245,233,220,.55);
      --fg3: rgba(245,233,220,.35);
      --border: rgba(245,233,220,.1);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a0f13;
    --card: #251419;
    --fg: #F5E9DC;
    --fg2: rgba(245,233,220,.55);
    --fg3: rgba(245,233,220,.35);
    --border: rgba(245,233,220,.1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Barlow', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px;
    min-height: 100vh;
  }
  .wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .logo { font-size: 11px; font-weight: 800; letter-spacing: 3px; color: var(--accent); text-align: center; padding-bottom: 4px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .card-head { padding: 12px 16px 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .card-label { font-size: 9.5px; font-weight: 700; letter-spacing: 2px; color: var(--fg2); }
  .card-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  label { font-size: 9.5px; font-weight: 700; letter-spacing: 1.5px; color: var(--fg2); display: block; margin-bottom: 5px; }
  input[type=email], input[type=password], select {
    width: 100%; padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: inherit; font-size: 13px;
    color: var(--fg); background: var(--bg);
    outline: none; appearance: none; -webkit-appearance: none;
    transition: border-color .15s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .btn {
    width: 100%; padding: 12px;
    background: var(--accent); color: var(--accent-fg);
    border: none; border-radius: 999px;
    font-family: inherit; font-size: 13.5px; font-weight: 700;
    cursor: pointer; transition: opacity .15s;
  }
  .btn:hover { opacity: .88; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.secondary { background: var(--border); color: var(--fg); }
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    position: relative;
  }
  .drop-zone.over { border-color: var(--accent); background: rgba(107,31,51,.06); }
  .drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .drop-icon { font-size: 28px; margin-bottom: 6px; }
  .drop-label { font-size: 13px; font-weight: 600; color: var(--fg); }
  .drop-sub { font-size: 11px; color: var(--fg3); margin-top: 3px; }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
  .result-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .result-row:last-child { border-bottom: none; }
  .result-name { flex: 1.4; font-size: 13px; font-weight: 600; min-width: 0; }
  .result-ev { flex: 1; font-size: 12px; color: var(--fg2); min-width: 0; }
  .result-time { font-size: 13px; font-weight: 700; color: var(--accent); min-width: 52px; text-align: right; }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; letter-spacing: 1px; padding: 3px 8px; border-radius: 999px; }
  .tag.green { background: rgba(27,122,120,.12); color: var(--green); }
  .tag.red { background: rgba(192,57,43,.1); color: var(--red); }
  .msg { font-size: 12px; color: var(--fg2); text-align: center; padding: 8px 0; }
  .err { font-size: 12px; color: var(--red); padding: 4px 0; }
  .skipped-list { font-size: 11.5px; color: var(--fg2); line-height: 1.6; }
  #screen-login, #screen-app { display: none; }
  #screen-login.show, #screen-app.show { display: block; }
  .done-icon { text-align: center; font-size: 44px; padding: 8px 0 4px; }
  .done-msg { text-align: center; font-size: 15px; font-weight: 700; }
  .done-sub { text-align: center; font-size: 12px; color: var(--fg2); margin-top: 4px; }
</style>

<div class="wrap">
  <div class="logo">SCOTSWIM</div>

  <!-- LOGIN -->
  <div id="screen-login">
    <div class="card">
      <div class="card-head"><span class="card-label">SIGN IN</span></div>
      <div class="card-body">
        <div>
          <label>EMAIL</label>
          <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
        </div>
        <div>
          <label>PASSWORD</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div id="login-err" class="err" hidden></div>
        <button class="btn" id="login-btn" onclick="doLogin()">Sign In</button>
      </div>
    </div>
  </div>

  <!-- APP -->
  <div id="screen-app">

    <!-- Step 1: pick meet -->
    <div class="card" id="step-meet">
      <div class="card-head">
        <span class="card-label">SELECT MEET</span>
        <span id="user-label" style="font-size:11px;color:var(--fg3)"></span>
      </div>
      <div class="card-body">
        <div>
          <label>MEET</label>
          <select id="meet-sel" onchange="onMeetChange()">
            <option value="">Loading meets…</option>
          </select>
        </div>
        <div>
          <label>DATE (auto-filled from meet)</label>
          <input type="text" id="meet-date-display" readonly style="color:var(--fg2);cursor:default">
        </div>
      </div>
    </div>

    <!-- Step 2: upload PDF or paste from Claude -->
    <div class="card" id="step-upload">
      <div class="card-head"><span class="card-label">IMPORT RESULTS</span></div>
      <div class="card-body">
        <!-- Tab switcher -->
        <div style="display:flex;gap:8px;margin-bottom:4px">
          <button id="tab-pdf" onclick="switchTab('pdf')" style="flex:1;padding:8px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer">Upload PDF</button>
          <button id="tab-paste" onclick="switchTab('paste')" style="flex:1;padding:8px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);color:var(--fg2);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer">Paste from Claude</button>
        </div>

        <!-- PDF tab -->
        <div id="panel-pdf">
          <div class="drop-zone" id="drop-zone"
            ondragover="event.preventDefault();this.classList.add('over')"
            ondragleave="this.classList.remove('over')"
            ondrop="onDrop(event)">
            <input type="file" accept=".pdf" id="pdf-input" onchange="onFileChange(event)">
            <div class="drop-icon">📄</div>
            <div class="drop-label" id="drop-label">Drop PDF here or tap to browse</div>
            <div class="drop-sub">SwimCloud results sheet</div>
          </div>
          <div class="progress-bar" id="progress-wrap" hidden>
            <div class="progress-fill" id="progress-fill" style="width:0%"></div>
          </div>
          <div id="parse-msg" class="msg" hidden></div>
        </div>

        <!-- Paste tab -->
        <div id="panel-paste" hidden>
          <label>PASTE DATA FROM CLAUDE</label>
          <textarea id="paste-input" placeholder='Paste the JSON data Claude gave you here…' style="width:100%;min-height:120px;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:monospace;font-size:11px;color:var(--fg);background:var(--bg);resize:vertical;outline:none;box-sizing:border-box" oninput="this.style.borderColor='var(--border)'"></textarea>
          <button class="btn" onclick="loadPastedData()" style="margin-top:4px">Load Data</button>
          <div id="paste-msg" style="font-size:12px;color:var(--red);margin-top:6px;min-height:18px"></div>
        </div>
      </div>
    </div>

    <!-- Step 3: preview -->
    <div class="card" id="step-preview" hidden>
      <div class="card-head">
        <span class="card-label">PREVIEW</span>
        <span id="preview-counts" style="font-size:11px;color:var(--fg2)"></span>
      </div>
      <div class="card-body" style="padding-bottom:0">
        <div id="preview-list"></div>
        <div id="skipped-section" hidden style="padding:10px 0 14px">
          <div style="font-size:9.5px;font-weight:700;letter-spacing:1.5px;color:var(--fg2);margin-bottom:5px">NOT MATCHED</div>
          <div class="skipped-list" id="skipped-list"></div>
        </div>
      </div>
      <div style="padding:14px 16px;display:flex;gap:10px;border-top:1px solid var(--border)">
        <button class="btn secondary" style="flex:1" onclick="resetUpload()">← Redo</button>
        <button class="btn" style="flex:2" id="confirm-btn" onclick="doConfirm()">Save Times</button>
      </div>
    </div>

    <!-- Done -->
    <div class="card" id="step-done" hidden>
      <div class="card-body" style="padding:24px 16px">
        <div class="done-icon">✅</div>
        <div class="done-msg" id="done-msg">Times saved!</div>
        <div class="done-sub" id="done-sub"></div>
        <div style="margin-top:20px">
          <button class="btn" onclick="resetAll()">Upload Another Meet</button>
        </div>
      </div>
    </div>

  </div><!-- /screen-app -->
</div>

<script>

if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);

const EV_NAME_MAP = {

  '50 Free':'50FR','100 Free':'100FR','200 Free':'200FR',

  '200BK':'200 Back','50BR':'50 Breast','100BR':'100 Breast','200BR':'200 Breast',

let roster = {};   // name→{id,name}
let parsedResults = [];
let parsedSkipped = [];
let selectedMeetId = '';
let selectedMeetDate = '';

const SEED_MEETS = [
  {id:'2026-10-09',dateStart:'2026-10-09',n:'Alma at SVSU & LSSU'},
  {id:'2026-10-17',dateStart:'2026-10-17',n:'Alma at Albion'},

  {id:'2026-11-07',dateStart:'2026-11-07',n:'Alma vs. Manchester'},

  {id:'2027-01-23',dateStart:'2027-01-23',n:'MIAA Invite'},
  {id:'2027-01-30',dateStart:'2027-01-30',n:'Alma vs. Kalamazoo'},
  {id:'2027-02-17',dateStart:'2027-02-17',n:'MIAA Championships'},
  {id:'2027-03-18',dateStart:'2027-03-18',n:'D3 National Championships'},
];
let meets = [...SEED_MEETS];  // pre-populated; Firestore may replace later

// Pre-populate dropdown immediately from seed data (no Firestore needed)

// ── Auth ─────────────────────────────────────────────────────────────
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('screen-login').classList.remove('show');
    document.getElementById('screen-app').classList.add('show');
    document.getElementById('user-label').textContent = user.email;

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value;
  const errEl = document.getElementById('login-err');
  errEl.hidden = true;
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch(e) {

  if (e.key === 'Enter') doLogin();
});

// ── Seed roster (mirrors app's MEN/WOMEN arrays; id = name) ──────────
const SEED_MEN = [
  'Andrew Barrett','Cody Benkovsky','Karl Bray','Ruairidh Davis',
  'Rayane Debbarh','Ryan Fowler','Brett Gaff','Anthony Kulka',
  'Colin Moran','Noah Newman','Max Nielsen','Colton Ralko',
  'Morrison Wood','Nate Yearkey',
];
const SEED_WOMEN = [
  'Zoe Barringer','Anya Drewnicki','Abby Dumond','Kellie Fahey',
  'Rowan Frost','Marie Halligan','Aubrey Hawks','Emma Hoy',
  'Katelyn Lamphere','Isabel Lyshol','Maddie McGuire','Sarah Rabbideau',
  'Heidi Ragainis','Sierra Scott','Abi Spitzley','Hannah Sullivan',
  'Valerie Vinci','Delilah Zingelewicz',
];

function addToRoster(name) {
  const a = {id: name, name};
  const nm = name.toLowerCase().trim();
  roster[nm] = a;
  const parts = name.trim().split(/\s+/);
  if (parts.length >= 2) {
    const rev = (parts[parts.length-1]+', '+parts.slice(0,-1).join(' ')).toLowerCase();
    roster[rev] = a;
    const lk = '_last_'+parts[parts.length-1].toLowerCase();
    if (!roster[lk]) roster[lk] = a;
  }
}

// ── Load roster + meets ───────────────────────────────────────────────
async function loadData() {
  // Build roster from seed + Firestore edits (same logic as app's buildRoster)
  [...SEED_MEN, ...SEED_WOMEN].forEach(addToRoster);
  try {
    const doc = await db.collection('roster').doc('main').get();
    if (doc.exists) {
      const d = doc.data();
      // Remove athletes coaches removed
      (d.removed || []).forEach(name => {
        const nm = name.toLowerCase().trim();
        delete roster[nm];
        const parts = name.trim().split(/\s+/);
        if (parts.length >= 2) {
          delete roster[(parts[parts.length-1]+', '+parts.slice(0,-1).join(' ')).toLowerCase()];
          delete roster['_last_'+parts[parts.length-1].toLowerCase()];
        }
      });
      // Add athletes coaches added
      (d.added || []).forEach(a => { if (a.name) addToRoster(a.name); });
    }
  } catch(e) { console.warn('roster edits load failed', e); }

  // schedule — try to load from Firestore; falls back to SEED_MEETS already in meets[]
  try {
    const doc = await db.collection('schedule').doc('meets').get();
    const items = (doc.exists && doc.data().items) || [];
    if (items.length) {
      meets.length = 0;
      items.forEach(m => { if (m.id && m.n) meets.push(m); });
    }
    meets.sort((a,b) => (b.dateStart||'').localeCompare(a.dateStart||''));
  } catch(e) {
    meets.sort((a,b) => (b.dateStart||'').localeCompare(a.dateStart||''));
  }

  populateMeets();
}

function populateMeets() {
  const sel = document.getElementById('meet-sel');
  sel.innerHTML = '<option value="">— pick a meet —</option>';
  meets.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.id;
    opt.textContent = m.n + (m.dateStart ? '  ·  ' + fmtDate(m.dateStart) : '');
    sel.appendChild(opt);
  });
}

function fmtDate(iso) {
  if (!iso) return '';
  const [y,mo,d] = iso.split('-');
  return (mo||'')+'/'+(d||'')+'/'+(y||'');
}

function onMeetChange() {
  const sel = document.getElementById('meet-sel');
  selectedMeetId = sel.value;
  const m = meets.find(x => x.id === selectedMeetId);
  selectedMeetDate = m ? fmtDate(m.dateStart) : '';
  document.getElementById('meet-date-display').value = selectedMeetDate || '—';
  resetUpload();
}

// ── Tab switching ─────────────────────────────────────────────────────
function switchTab(tab) {
  const isPdf = tab === 'pdf';
  document.getElementById('panel-pdf').hidden = !isPdf;
  document.getElementById('panel-paste').hidden = isPdf;
  document.getElementById('tab-pdf').style.cssText = isPdf
    ? 'flex:1;padding:8px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer'
    : 'flex:1;padding:8px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);color:var(--fg2);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer';
  document.getElementById('tab-paste').style.cssText = isPdf
    ? 'flex:1;padding:8px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);color:var(--fg2);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer'
    : 'flex:1;padding:8px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer';
}

function loadPastedData() {
  const raw = document.getElementById('paste-input').value.trim();
  const msg = document.getElementById('paste-msg');
  if (!raw) { msg.textContent = 'Nothing pasted yet.'; return; }
  try {
    const data = JSON.parse(raw);
    if (!Array.isArray(data) || !data.length) throw new Error('Expected a non-empty array.');
    if (!data[0].athleteId) throw new Error('Missing athleteId field.');
    parsedResults = data;
    parsedSkipped = [];
    msg.textContent = '';
    showPreview();
  } catch(e) {
    msg.textContent = 'Could not read data: ' + e.message;
  }
}

// ── PDF handling ──────────────────────────────────────────────────────
function onDrop(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f && f.type === 'application/pdf') processPdf(f);
}

function onFileChange(e) {
  const f = e.target.files[0];
  if (f) processPdf(f);
}

function setProgress(pct) {
  document.getElementById('progress-wrap').hidden = false;
  document.getElementById('progress-fill').style.width = pct + '%';
}

async function processPdf(file) {
  if (!selectedMeetId) {
    alert('Please select a meet first.');
    return;
  }
  document.getElementById('drop-label').textContent = file.name;
  document.getElementById('parse-msg').hidden = false;
  document.getElementById('parse-msg').textContent = 'Reading PDF…';
  setProgress(10);

  try {
    const buf = await file.arrayBuffer();
    setProgress(30);
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    setProgress(50);

    const allItems = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      const vp = page.getViewport({scale:1});
      tc.items.forEach(it => {
        if (it.str) allItems.push({str: it.str, x: it.transform[4], y: vp.height - it.transform[5]});
      });
      setProgress(50 + Math.round(40 * p / pdf.numPages));
    }

    setProgress(95);
    parsePdf(allItems, file.name);
    setProgress(100);
    // expose raw lines for debugging if 0 matches
    window._lastPdfItems = allItems;
  } catch(err) {
    document.getElementById('parse-msg').textContent = 'Could not read PDF: ' + err.message;
    setProgress(0);
    document.getElementById('progress-wrap').hidden = true;
  }
}

function parsePdf(items, fileName) {
  const TIME_RE = /^\d{1,3}:\d{2}\.\d{2}$|^\d{1,3}\.\d{2}$/;

  // Group by Y bucket — ASCENDING (top of page first)
  const lineMap = {};
  items.forEach(it => {
    if (!it.str) return;
    const yKey = Math.round(it.y / 3) * 3;
    (lineMap[yKey] = lineMap[yKey] || []).push(it);
  });
  const lines = Object.keys(lineMap).map(Number).sort((a,b) => a - b)
    .map(yKey => {
      const its = lineMap[yKey].slice().sort((a,b) => a.x - b.x);
      return {y: yKey, strs: its.map(it => it.str.trim()).filter(s => s)};
    });

  const results = [];
  const skipped = new Set();
  let curEvId = null;

  for (let li = 0; li < lines.length; li++) {
    const {strs} = lines[li];
    if (!strs.length) continue;
    const lineText = strs.join(' ');

    // Event header: "Event #3 - 1000 Free Women"
    const evHdrMatch = lineText.match(/Event\s*#?\s*\d+\s*[-–]\s*(.+)/i);
    if (evHdrMatch) {
      let evName = evHdrMatch[1].trim().replace(/\s+(Women|Men)$/i, '').trim();
      if (/relay/i.test(evName)) {
        curEvId = null;
      } else {
        curEvId = null;
        for (const [key, id] of Object.entries(EV_NAME_MAP)) {
          if (evName.toLowerCase().includes(key.toLowerCase())) { curEvId = id; break; }
        }
      }
      continue;
    }

    if (!curEvId) continue;

    // Skip column header rows (Name / Team / Score / Time / Place)
    if (strs.length <= 6 && strs.filter(s => /^(Name|Team|Score|Time|Place|Pts)$/i.test(s)).length >= 2) continue;

    // Match athlete by name
    let matchedAthlete = null;
    for (let si = 0; si < strs.length; si++) {
      const s = strs[si];
      let a = roster[s.toLowerCase().trim()];
      if (!a && si + 1 < strs.length) a = roster[(s + ' ' + strs[si + 1]).toLowerCase().trim()];
      if (!a) {
        const parts = s.trim().split(/\s+/);
        if (parts.length >= 2) a = roster['_last_' + (parts[parts.length - 1] || '').toLowerCase()];
      }
      if (a) { matchedAthlete = a; break; }
    }
    if (!matchedAthlete) continue;

    // Find LAST clean time/score on this line (overwrites splits, keeps final value)
    let timeStr = '';
    for (const t of strs) {
      if (TIME_RE.test(t)) timeStr = t;
    }

    if (timeStr) {
      results.push({
        athleteId: matchedAthlete.id,
        athleteName: matchedAthlete.name,
        eventId: curEvId,
        evName: EV_NAMES[curEvId] || curEvId,
        time: timeStr,
        date: selectedMeetDate,
      });
    } else {
      skipped.add(matchedAthlete.name);
    }
  }

  parsedResults = results;
  parsedSkipped = [...skipped];
  showPreview();
}

function showPreview() {
  document.getElementById('step-upload').hidden = true;
  document.getElementById('step-preview').hidden = false;

  const athleteCount = new Set(parsedResults.map(r => r.athleteId)).size;
  document.getElementById('preview-counts').textContent =
    parsedResults.length + ' time' + (parsedResults.length !== 1 ? 's' : '') +
    ' · ' + athleteCount + ' athlete' + (athleteCount !== 1 ? 's' : '');

  const list = document.getElementById('preview-list');
  list.innerHTML = '';

  if (!parsedResults.length) {
    // Show first 60 PDF lines so we can debug the format
    const items = window._lastPdfItems || [];
    const lineMap = {};
    items.forEach(it => { if (!it.str) return; const k = Math.round(it.y/3)*3; (lineMap[k]=lineMap[k]||[]).push(it); });
    const lines = Object.keys(lineMap).map(Number).sort((a,b)=>b-a)
      .slice(0,60).map(k => lineMap[k].slice().sort((a,b)=>a.x-b.x).map(i=>i.str.trim()).filter(s=>s).join(' | '));
    const rosterNames = Object.keys(roster).filter(k=>!k.startsWith('_last_')).slice(0,10).join(', ');
    list.innerHTML = '<div class="msg" style="text-align:left;font-size:11px;color:var(--red)">No times matched.<br><br>'
      + '<b>Roster sample (first 10 keys):</b><br>' + rosterNames + '<br><br>'
      + '<b>PDF lines (first 60):</b><br>'
      + lines.map(l=>'<span style="display:block;padding:1px 0;border-bottom:1px solid var(--border)">'+l+'</span>').join('')
      + '</div>';
  } else {
    parsedResults.forEach(r => {
      const row = document.createElement('div');
      row.className = 'result-row';
      row.innerHTML =
        `<div class="result-name">${r.athleteName}</div>` +
        `<div class="result-ev">${r.evName}</div>` +
        `<div class="result-time">${r.time}</div>`;
      list.appendChild(row);
    });
  }

  const skipSec = document.getElementById('skipped-section');
  if (parsedSkipped.length) {
    skipSec.hidden = false;
    document.getElementById('skipped-list').textContent = parsedSkipped.join(', ');
  } else {
    skipSec.hidden = true;
  }

  const btn = document.getElementById('confirm-btn');
  btn.textContent = 'Save ' + parsedResults.length + ' Times';
  btn.disabled = !parsedResults.length;
}

async function doConfirm() {
  if (!parsedResults.length || !selectedMeetId) return;
  const btn = document.getElementById('confirm-btn');
  btn.disabled = true; btn.textContent = 'Saving…';

  const meetObj = meets.find(m => m.id === selectedMeetId);
  const meetLabel = (meetObj ? meetObj.n : selectedMeetId) + (selectedMeetDate ? ' · ' + selectedMeetDate : '');

  try {
    await db.collection('meetResults').doc(selectedMeetId).set({
      results: parsedResults.map(({athleteId, eventId, time, date}) => ({athleteId, eventId, time, date})),
      importedAt: Date.now(),
      meetLabel,
    });

    const athleteCount = new Set(parsedResults.map(r => r.athleteId)).size;
    document.getElementById('step-preview').hidden = true;
    document.getElementById('step-done').hidden = false;
    document.getElementById('done-msg').textContent =
      parsedResults.length + ' time' + (parsedResults.length !== 1 ? 's' : '') + ' saved';
    document.getElementById('done-sub').textContent =
      athleteCount + ' athlete' + (athleteCount !== 1 ? 's' : '') + ' — all devices update instantly';
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Save ' + parsedResults.length + ' Times';
    alert('Save failed: ' + (e.message || e));
  }
}

function resetUpload() {
  parsedResults = [];
  parsedSkipped = [];
  document.getElementById('step-upload').hidden = false;
  document.getElementById('step-preview').hidden = true;
  document.getElementById('step-done').hidden = true;
  document.getElementById('drop-label').textContent = 'Drop PDF here or tap to browse';
  document.getElementById('parse-msg').hidden = true;
  document.getElementById('progress-wrap').hidden = true;
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('pdf-input').value = '';
}

function resetAll() {
  selectedMeetId = '';
  selectedMeetDate = '';
  document.getElementById('meet-sel').value = '';
  document.getElementById('meet-date-display').value = '';
  resetUpload();
}
</script>
